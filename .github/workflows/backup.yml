name: Back up versions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backup-main
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure backup author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check application and backup tools
        run: |
          go test ./...
          go vet ./...
          python3 -m unittest discover -s scripts/tests -v
          node geomap/tests/v22-division-ages.mjs
          node geomap/tests/v21-strat-terrain.mjs
          node geomap/tests/intrusions-v20.mjs
          node geomap/tests/inherited-folds.mjs
          node geomap/tests/folding-model.mjs
          node geomap/tests/layer-controls.mjs
      - name: Save immutable version backup and tag
        run: python3 scripts/backup_version.py --push
      - name: Publish backed-up versions without replacing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_releases.py --repo "$GH_REPO"
