name: Windows desktop checks
on:
  push:
    branches: [main, 'gui-check/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test native controls and generate a complete set
        env:
          WULFF_GUI_SCREENSHOTS: '${{ github.workspace }}\dist\native-screenshots'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go test -v -timeout 120s ./... 2>&1 | Tee-Object -FilePath dist/native-test.log
          $testCode = $LASTEXITCODE
          if ($testCode -ne 0) {
            $details = (Get-Content dist/native-test.log -Tail 90) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows test details::$details"
            exit $testCode
          }
      - name: Vet Windows code
        run: go vet ./...
      - name: Build standalone Windows program
        run: go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/GeoMap_Wulff.exe .
      - name: Keep Windows screenshots and executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/native-screenshots/*.png
            dist/GeoMap_Wulff.exe
            dist/native-test.log
